name: Bug in gitmanual
description: Something on the site or in the code is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or URL, and your browser.
  - type: textarea
    id: logs
    attributes:
      label: Errors or screenshots
      render: text
