# Hourly Facebook Page sync for the optional Finds page (Vercel's free plan only allows a daily cron).
# Runs only where it's set up: add the repository variable SYNC_URL (e.g. https://gitmanual.com/api/cron/facebook)
# and the secret CRON_SECRET under Settings → Secrets and variables → Actions. Forks without them skip it.
name: Sync Facebook posts

on:
  schedule:
    - cron: "17 * * * *" # every hour, at :17 (GitHub queues jobs at :00 the longest)
  workflow_dispatch: # "Run workflow" button for an immediate sync

jobs:
  sync:
    if: vars.SYNC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o result.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL")
          # Counts only: captions and repo names stay out of the public log.
          python3 -c "import json;d=json.load(open('result.json'));print(d.get('error') or f\"added {d['added']}, updated {d['updated']}, skipped {len(d['skipped'])}\")"
          test "$status" = 200
