# Really runs the generated setup scripts on fresh macOS, Windows and Linux machines, for the repos in
# scripts/setup-test-repos.json that have a "run" list. Each repo/system is its own job, so one failure doesn't
# hide the others. The scripts are built from this branch's code, so a pull request is tested before it ships.
name: Setup scripts

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays: catches repos that changed their setup
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "scripts/check-setup-scripts.ts"
      - "scripts/print-setup-script.ts"
      - "scripts/setup-test-repos.json"
      - ".github/workflows/setup-scripts.yml"

permissions:
  contents: read

# A new push to the same pull request replaces the run that's still going.
concurrency:
  group: setup-scripts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          echo "matrix=$(jq -c '[.repos[] | select(.run) | .repo as $r | .kind as $k | .run[] | {repo: $r, kind: $k, os: .}]' scripts/setup-test-repos.json)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    name: ${{ matrix.repo }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os == 'mac' && 'macos-latest' || matrix.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      REPO: ${{ matrix.repo }}
      OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gitmanual
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gitmanual/package-lock.json
      - name: Build the script from this branch
        shell: bash
        working-directory: gitmanual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --ignore-scripts
          mkdir -p ../work
          npm run -s setup-script -- "$REPO" "$OS" > "../work/setup.$([ "$OS" = windows ] && echo ps1 || echo sh)"
      - name: Run setup.sh
        if: matrix.os != 'windows'
        working-directory: work
        run: |
          cat setup.sh
          bash setup.sh
      - name: Run setup.ps1
        if: matrix.os == 'windows'
        working-directory: work
        shell: pwsh
        run: |
          Get-Content setup.ps1
          # Windows PowerShell 5.1, what a fresh Windows opens by default.
          powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "| ${{ matrix.kind }} | \`$REPO\` | $OS | ${{ job.status == 'success' && '✅ set up' || '❌ failed' }} |" >> "$GITHUB_STEP_SUMMARY"
