name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Builds the setup scripts for the test repos (analyzed fresh) and checks them, PowerShell included.
      - run: npm run check:scripts -- --add
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
